name: Translator tests
on:
  push:
    branches: [main, feature/smarter-balanced-translator]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python files
        run: python -m py_compile bot.py translator.py
      - name: Run translation regression tests
        run: python -m unittest discover -s tests -v
